# Supabase CLI configuration — used by `supabase start` (local) and `supabase config push` (hosted).
project_id = "serenity-meal-pass"
# Hosted project: cnnpktykuoiygmuezozn (ap-south-1, Mumbai) — https://cnnpktykuoiygmuezozn.supabase.co

[api]
schemas = ["public"]
max_rows = 2000

[auth]
site_url = "https://bshah0708.github.io/serenity-meal-pass"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Your Serenity Space login code is {{ .Code }}"
max_frequency = "60s"
# Free test logins before MSG91 is live: these numbers always accept the code shown (no SMS sent).
[auth.sms.test_otp]
919724212198 = "123456"

# SMS goes through the MSG91 hook below, so no built-in provider is enabled.
[auth.hook.send_sms]
enabled = true
uri = "https://cnnpktykuoiygmuezozn.supabase.co/functions/v1/sms-hook"
secrets = "env(SEND_SMS_HOOK_SECRETS)"

[auth.rate_limit]
sms_sent = 60

[auth.email]
# accounts for email login are created by the email-otp function (admin API), not by open sign-up
enable_signup = false
otp_length = 6
otp_expiry = 3600

[functions.sms-hook]
verify_jwt = false

[functions.send-pass]
verify_jwt = true

# email login codes (people are not logged in yet; the function has its own rate limits)
[functions.email-otp]
verify_jwt = false
