# Publishes the web app (web/) to GitHub Pages.
# Uses web/config.js (committed; the anon key is public by design) unless repository variables
# SUPABASE_URL / SUPABASE_ANON_KEY / SITE_URL are set. Needs Settings → Pages → Source = "GitHub Actions".
name: Deploy website
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - name: Write config.js (from repository variables, if set; otherwise the committed web/config.js is used)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf 'window.SS_CONFIG={supabaseUrl:%s,supabaseAnonKey:%s,siteUrl:%s};\n' \
              "$(jq -Rn --arg v "$SUPABASE_URL" '$v')" "$(jq -Rn --arg v "$SUPABASE_ANON_KEY" '$v')" "$(jq -Rn --arg v "$SITE_URL" '$v')" > web/config.js
          elif [ ! -f web/config.js ]; then
            echo "::error::No web/config.js and no SUPABASE_URL / SUPABASE_ANON_KEY variables"; exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: deployment
        uses: actions/deploy-pages@v4
